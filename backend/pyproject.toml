[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "shouldibuy"
dynamic = ["version", "dependencies"]
description = "Buyer-side 'is this a fair price?' analysis API."
readme = "README.md"
authors = [
    { name = "ShouldIBuy Engineering" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

[project.scripts]
shouldibuy = "shouldibuy.app:main"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.version]
path = "cz.toml"
pattern = "version = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/shouldibuy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/shouldibuy",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long, handled by formatter
    "S101",  # Use of assert detected (OK in tests)
    "S104",  # Hardcoded bind to all interfaces (OK for server)
    "S311",  # secrets used, not cryptographic randomness concern here
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S106", "S311", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["shouldibuy"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["shouldibuy"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]
